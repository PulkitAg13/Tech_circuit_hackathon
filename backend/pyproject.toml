[project]
name = "canongate"
version = "0.1.0"
description = "Pre-publication brand & claim governance platform"
requires-python = ">=3.12"
# Permissive license policy (MIT / Apache-2.0 / BSD-3):
# DO NOT add `pymerkle` or `krippendorff` (`fast-krippendorff`) here — both are
# GPL-3.0 copyleft. RFC 9162 Merkle trees and vectorized Krippendorff's alpha
# are implemented natively in `canongate.ledger.merkle` and `canongate.ledger.friction`.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "scikit-image>=0.24",
    "numpy>=2.0",
    "scipy>=1.14.0",
    "sympy>=1.13.0",
    "z3-solver>=4.13.0",
    "onnxruntime>=1.20.0",
    "spacy>=3.8.0",
    "rank-bm25>=0.2.2",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "beautifulsoup4>=4.15.0",
    "python-docx>=1.2.0",
    "pypdf>=6.21.2",
    "pdfplumber>=0.11.10",
]

[project.scripts]
canongate = "canongate.cli:main"
canongate-mcp = "canongate.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1",
    "import-linter>=2.1",
    "syrupy>=4.7",
]
ml = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "minicheck>=0.0.2",
    "qasem>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canongate"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # UTS #39 homoglyphs are intentional in tests and confusable check

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["canongate"]

[[tool.importlinter.contracts]]
name = "domain must not import internal modules"
type = "forbidden"
source_modules = ["canongate.domain"]
forbidden_modules = ["canongate.engine", "canongate.checks", "canongate.parsers", "canongate.store", "canongate.api", "canongate.ledger", "canongate.mcp"]

[[tool.importlinter.contracts]]
name = "checks must not import store or api"
type = "forbidden"
source_modules = ["canongate.checks"]
forbidden_modules = ["canongate.store", "canongate.api", "canongate.ledger", "canongate.mcp"]

[[tool.importlinter.contracts]]
name = "engine must not import store or api"
type = "forbidden"
source_modules = ["canongate.engine"]
forbidden_modules = ["canongate.store", "canongate.api", "canongate.ledger", "canongate.mcp"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
