services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - CANONGATE_DB_URL=sqlite+aiosqlite:////data/canongate.db
      - CANONGATE_CANON_DIR=/app/canons
      - CANONGATE_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - canongate_data:/data
      - ./canons:/app/canons:ro
      - ./samples:/app/samples:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/canons')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  canongate_data:
